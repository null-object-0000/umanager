[package]
name = "umanager"
version = "0.9.0"
description = "A read-only first Ubuntu manager for vendor .deb applications"
authors = ["UManager contributors"]
edition = "2024"
rust-version = "1.97"

[lib]
name = "umanager_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "umanager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
base64 = "0.22"
drag = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "system-proxy", "socks"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
notify-rust = "4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
umanager-catalog = { path = "../crates/umanager-catalog" }
umanager-plan = { path = "../crates/umanager-plan" }
url = "2"

serde_json = "1"
