[package]
name = "umanager-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
libc = "0.2"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
umanager-catalog = { path = "../umanager-catalog" }
umanager-plan = { path = "../umanager-plan" }

# Invoked only by the UManager DEB's postinst, never by the download queue.
[[bin]]
name = "umanager-apparmor"
path = "src/apparmor_main.rs"
